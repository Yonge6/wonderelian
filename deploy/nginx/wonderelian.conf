map $host $wonderelian_root {
    hostnames;
    default                              /srv/wonderelian/wonderelian.com;
    wonderelian.com                      /srv/wonderelian/wonderelian.com;
    www.wonderelian.com                  /srv/wonderelian/wonderelian.com;
    yixiu.wonderelian.com                /srv/wonderelian/yixiu.wonderelian.com;
    human-design.wonderelian.com         /srv/wonderelian/human-design.wonderelian.com;
    wendao.wonderelian.com               /srv/wonderelian/wendao.wonderelian.com;
    style-atlas.wonderelian.com          /srv/wonderelian/style-atlas.wonderelian.com;
    onelaser.wonderelian.com             /srv/wonderelian/onelaser.wonderelian.com;
    ops.wonderelian.com                  /srv/wonderelian/ops.wonderelian.com;
    maker.wonderelian.com                /srv/wonderelian/maker.wonderelian.com;
    august-booth.wonderelian.com         /srv/wonderelian/august-booth.wonderelian.com;
}

server {
    listen 80;
    listen [::]:80;
    server_name
        wonderelian.com
        www.wonderelian.com
        human-design.wonderelian.com
        wendao.wonderelian.com
        style-atlas.wonderelian.com
        ops.wonderelian.com
        maker.wonderelian.com
        august-booth.wonderelian.com;

    # Use a shared webroot so every hostname can complete ACME validation
    # even though the public site roots are selected dynamically by $host.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name
        wonderelian.com
        www.wonderelian.com
        human-design.wonderelian.com
        style-atlas.wonderelian.com
        ops.wonderelian.com
        maker.wonderelian.com
        august-booth.wonderelian.com;

    ssl_certificate /etc/letsencrypt/live/wonderelian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wonderelian.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root $wonderelian_root;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /__wonderelian_health {
        access_log off;
        default_type text/plain;
        return 200 "wonderelian-alicloud-ok\n";
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico|mp3|m4a|aac|ogg|wav|mp4|webm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ $uri.html @wonderelian_missing;
        add_header Cache-Control "no-cache" always;
    }

    # Only the personal site uses explicit missing pages. Other mapped apps keep
    # their existing client-side route fallback.
    location @wonderelian_missing {
        error_page 404 /404.html;
        if ($host = wonderelian.com) { return 404; }
        if ($host = www.wonderelian.com) { return 404; }
        rewrite ^ /index.html last;
    }
}
